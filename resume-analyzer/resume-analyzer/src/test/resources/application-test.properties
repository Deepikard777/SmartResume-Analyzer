spring.application.name=resume-analyzer-test

# In-memory H2 database for isolated testing
spring.datasource.url=jdbc:h2:mem:resume_analyzer;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Test upload directory
resume.storage.directory=target/test-uploads
resume.max-file-size=10MB

# Spring Servlet Multipart limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
