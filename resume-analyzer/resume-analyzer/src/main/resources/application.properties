spring.application.name=resume-analyzer

# Database configuration using environment variables with local defaults
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/resume_analyzer?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Resume upload & storage configuration
resume.storage.directory=${RESUME_STORAGE_DIRECTORY:./uploads/resumes}
resume.max-file-size=${RESUME_MAX_FILE_SIZE:10MB}

# Spring Servlet Multipart limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---------------------------------------------------------------------------
# JWT (stateless bearer-token authentication)
#
# app.jwt.secret has NO default: supply a random value of at least 32 bytes via
# the JWT_SECRET environment variable. If it is left empty, a random key is
# generated at startup, which is secure but invalidates every issued token when
# the process restarts.
#
#   PowerShell:  $env:JWT_SECRET='<at least 32 random characters>'
# ---------------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.issuer=smartresume-analyzer

# ---------------------------------------------------------------------------
# Optional LLM-backed recommendations
#
# DISABLED BY DEFAULT, and there is no default API key. With app.llm.enabled=false
# (or with any value missing) the feature answers 503 and the deterministic
# recommendations continue to work exactly as before.
#
# The transport is the OpenAI-compatible POST {base-url}/chat/completions shape,
# which Azure OpenAI, Groq, Together, OpenRouter, vLLM and Ollama also serve.
# Keys stay on the server: they are never sent to the browser or written to logs.
#
#   PowerShell example:
#     $env:LLM_ENABLED='true'
#     $env:LLM_BASE_URL='https://api.openai.com/v1'
#     $env:LLM_API_KEY='<your key>'
#     $env:LLM_MODEL='gpt-4o-mini'
# ---------------------------------------------------------------------------
app.llm.enabled=${LLM_ENABLED:false}
app.llm.base-url=${LLM_BASE_URL:}
app.llm.api-key=${LLM_API_KEY:}
app.llm.model=${LLM_MODEL:gpt-4o-mini}
app.llm.timeout-ms=${LLM_TIMEOUT_MS:8000}
app.llm.max-resume-chars=${LLM_MAX_RESUME_CHARS:6000}
app.llm.max-job-description-chars=${LLM_MAX_JD_CHARS:4000}
app.llm.max-recommendations=${LLM_MAX_RECOMMENDATIONS:6}
