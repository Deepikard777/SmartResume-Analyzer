# ---------------------------------------------------------------------------
# Local development profile (opt-in):  -Dspring-boot.run.profiles=dev
#
# Uses an in-memory H2 database so the application can be started without a
# MySQL server. The default profile is unchanged and still points at MySQL
# (see application.properties), so production behaviour is not affected.
#
# Data written in this profile lives only for the lifetime of the process.
# ---------------------------------------------------------------------------
spring.application.name=resume-analyzer

spring.datasource.url=jdbc:h2:mem:resume_analyzer_dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Resume upload & storage configuration
resume.storage.directory=${RESUME_STORAGE_DIRECTORY:./uploads/resumes}
resume.max-file-size=${RESUME_MAX_FILE_SIZE:10MB}

# Spring Servlet Multipart limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
